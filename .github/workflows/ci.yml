name: CI

on:
  push:
    branches: [ main, "research/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --all --verbose

      - name: Validate benchmark schemas and projections
        run: python3 scripts/validate_benchmarks.py

      - name: Run validation and reproduction regression tests
        run: |
          python3 scripts/test_validate_benchmarks.py
          python3 scripts/test_reproduce_runner.py
          python3 scripts/test_feasibility_alignment.py

      - name: Verify lightweight CI reproduction runner
        run: ./scripts/reproduce_benchmarks.sh --ci
