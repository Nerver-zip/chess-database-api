[package]
name = "chess-database-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
default-run = "chess-database"

[lib]
path = "src/lib.rs"

[[bin]]
name = "opening-explorer"
path = "src/legacy.rs"

[[bin]]
name = "chess-database"
path = "src/chess_database.rs"

[dependencies]
chess-database-core.workspace = true
chess-database-ingest.workspace = true
chess-database-curate.workspace = true
chess-database-storage.workspace = true
chess-database-index.workspace = true
chess-database-api.workspace = true

pgn-reader.workspace = true
zstd.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
shakmaty.workspace = true
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
rusqlite.workspace = true
