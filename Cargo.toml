[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingest",
    "crates/curate",
    "crates/storage",
    "crates/index",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nerver <https://github.com/Nerver-zip>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nerver-zip/chess-openings-db"
rust-version = "1.80"

[workspace.dependencies]
codb-core = { path = "crates/core" }
codb-ingest = { path = "crates/ingest" }
codb-curate = { path = "crates/curate" }
codb-storage = { path = "crates/storage" }
codb-index = { path = "crates/index" }

shakmaty = "0.30.2"
pgn-reader = "0.29.1"
zstd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.33", features = ["bundled"] }
memmap2 = "0.9"
byteorder = "1.5"
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3.13"
sha2 = "0.10"
