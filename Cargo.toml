[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingest",
    "crates/curate",
    "crates/storage",
    "crates/index",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Nerver <https://github.com/Nerver-zip>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nerver-zip/chess-database-api"
rust-version = "1.80"

[workspace.dependencies]
chess-database-core = { path = "crates/core" }
chess-database-ingest = { path = "crates/ingest" }
chess-database-curate = { path = "crates/curate" }
chess-database-storage = { path = "crates/storage" }
chess-database-index = { path = "crates/index" }
chess-database-api = { path = "crates/api" }

shakmaty = "0.30.2"
pgn-reader = "0.29.1"
zstd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.33", features = ["bundled", "hooks"] }
memmap2 = "0.9"
byteorder = "1.5"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3.13"
sha2 = "0.10"
libc = "0.2"
