name: opening-explorer-api

services:
  opening-explorer:
    image: opening-explorer-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${OPENING_EXPLORER_MEMORY_LIMIT:-${CODB_MEMORY_LIMIT:-512m}}
    cpus: ${OPENING_EXPLORER_CPU_LIMIT:-${CODB_CPU_LIMIT:-2}}
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    environment:
      RUST_LOG: ${OPENING_EXPLORER_LOG_LEVEL:-${CODB_LOG_LEVEL:-info}}
      OPENING_EXPLORER_ALLOWED_ORIGINS: ${OPENING_EXPLORER_ALLOWED_ORIGINS:-${CODB_ALLOWED_ORIGINS:-}}
      OPENING_EXPLORER_ENABLE_GAME_RETRIEVAL: ${OPENING_EXPLORER_ENABLE_GAME_RETRIEVAL:-${CODB_ENABLE_GAME_RETRIEVAL:-true}}
    command:
      - serve
      - --masters-dataset
      - /datasets/masters-otb
      - --elite-dataset
      - /datasets/elite-online
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reader-pool-size
      - "${OPENING_EXPLORER_READER_POOL_SIZE:-${CODB_READER_POOL_SIZE:-16}}"
      - --reader-pool-timeout-secs
      - "${OPENING_EXPLORER_READER_POOL_TIMEOUT_SECS:-${CODB_READER_POOL_TIMEOUT_SECS:-5}}"
      - --request-timeout-secs
      - "${OPENING_EXPLORER_REQUEST_TIMEOUT_SECS:-${CODB_REQUEST_TIMEOUT_SECS:-15}}"
      - --max-move-plies
      - "${OPENING_EXPLORER_MAX_MOVE_PLIES:-${CODB_MAX_MOVE_PLIES:-200}}"
      - --enable-game-retrieval
      - "${OPENING_EXPLORER_ENABLE_GAME_RETRIEVAL:-${CODB_ENABLE_GAME_RETRIEVAL:-true}}"
      - --deep-validate-on-startup
    volumes:
      - type: bind
        source: ${OPENING_EXPLORER_MASTERS_RELEASE_DIR:-${CODB_MASTERS_RELEASE_DIR:-${OPENING_EXPLORER_DATA_DIR:-${CODB_DATA_DIR:-./data}}/releases/masters-otb}}
        target: /datasets/masters-otb
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPENING_EXPLORER_ELITE_RELEASE_DIR:-${CODB_ELITE_RELEASE_DIR:-${OPENING_EXPLORER_DATA_DIR:-${CODB_DATA_DIR:-./data}}/releases/elite-online}}
        target: /datasets/elite-online
        read_only: true
        bind:
          create_host_path: false
    networks:
      opening-explorer-shared:
        aliases:
          - opening-explorer
          # Deprecated alias kept for sibling containers that still address the service as `codb`.
          - codb
    healthcheck:
      test:
        - CMD
        - /usr/bin/curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  opening-explorer-shared:
    name: ${OPENING_EXPLORER_NETWORK_NAME:-${CODB_NETWORK_NAME:-opening-explorer-shared}}
    external: ${OPENING_EXPLORER_NETWORK_EXTERNAL:-${CODB_NETWORK_EXTERNAL:-false}}
